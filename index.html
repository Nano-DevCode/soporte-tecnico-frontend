<!doctype html>
<html lang="es" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="logo-SinFondo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soporte Técnico</title>

    <script>
      // 1. Manejo del tema (Oscuro / Claro)
      (function() {
        const storageKey = 'soporte-tecnico-theme';
        const theme = localStorage.getItem(storageKey) || 'system';
        const isDark = theme === 'dark' || 
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(isDark ? 'dark' : 'light');
      })();

      // 2. Parche contra traductores/extensiones (Evita crash por removeChild e insertBefore)
      (function() {
        if (typeof window === 'undefined') return;

        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            if (console) {
              console.warn('removeChild: El nodo a eliminar no es hijo de este nodo. Evitando crash.', child, this);
            }
            return child;
          }
          return originalRemoveChild.call(this, child);
        };

        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (console) {
              console.warn('insertBefore: El nodo de referencia no es hijo de este nodo. Evitando crash.', referenceNode);
            }
            return newNode;
          }
          return originalInsertBefore.call(this, newNode, referenceNode);
        };
      })();
    </script>

    <!-- Tipos de letras -->
    <!-- Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;700&display=swap" rel="stylesheet">

  </head>
  <!-- 1. Refuerzo de atributos no-translate en <body> y en el <div id="root"> -->
  <body translate="no" class="notranslate">
    <div id="root" translate="no" class="notranslate"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
